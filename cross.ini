[binaries]
c = '/usr/bin/aarch64-linux-gnu-gcc'
cpp = '/usr/bin/aarch64-linux-gnu-g++'
ar = '/usr/bin/aarch64-linux-gnu-ar'
strip = '/usr/bin/aarch64-linux-gnu-strip'
ranlib = '/usr/bin/aarch64-linux-gnu-ranlib'
pkg-config = '/usr/local/bin/aarch64-linux-gnu-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'

[properties]
sys_root = '/sdk/usr'

[built-in options]
c_args = ['-I/sdk/prefix/include', '-I/sdk/prefix/include/freetype2', '-I/sdk/usr/include', '-I/sdk/SDL2-2.26.1/include', '-I/sdk/SDL2-2.26.1/include/SDL2', '-O2']
cpp_args = ['-I/sdk/prefix/include', '-I/sdk/prefix/include/freetype2', '-I/sdk/usr/include', '-I/sdk/SDL2-2.26.1/include', '-I/sdk/SDL2-2.26.1/include/SDL2', '-O2']
c_link_args = ['-L/sdk/prefix/lib', '-L/sdk/SDL2-2.26.1/lib', '-L/sdk/usr/lib']
cpp_link_args = ['-L/sdk/prefix/lib', '-L/sdk/SDL2-2.26.1/lib', '-L/sdk/usr/lib']
